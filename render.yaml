# Render Blueprint for the CouponKodee CMS server: Payload admin, REST API and MongoDB.
# The public storefront runs on Cloudflare Workers and reads from this server.
# Setup steps: NextDeals/DEPLOY.md
services:
  - type: web
    name: couponkodee-cms
    runtime: node
    plan: starter
    region: singapore
    rootDir: NextDeals
    # NODE_ENV must not be "production" during install, or devDependencies
    # (typescript, tailwind, cross-env) are skipped and the build fails.
    # `pnpm start` sets NODE_ENV=production itself.
    buildCommand: sh scripts/render/build.sh
    # Copies committed images onto the persistent disk if missing, then starts.
    startCommand: sh scripts/render/start.sh
