<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="100%" height="100%">
  <defs>
    <linearGradient id="myntra-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c0519"/>
      <stop offset="50%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="myntra-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>

  <rect width="600" height="250" rx="16" fill="url(#myntra-bg)"/>
  
  <circle cx="510" cy="110" r="110" fill="#f43f5e" opacity="0.25"/>

  <!-- Right Graphic: Fashion hanger / bag -->
  <g transform="translate(440, 50)">
    <polygon points="50,15 85,45 70,95 30,95 15,45" fill="#FFFFFF" opacity="0.95"/>
    <path d="M35,15 Q50,0 65,15" stroke="#be123c" stroke-width="3" fill="none"/>
    <text x="50" y="65" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#be123c" text-anchor="middle">MYNTRA</text>
    <rect x="15" y="105" width="70" height="22" rx="4" fill="#fde047"/>
    <text x="50" y="120" font-family="system-ui, sans-serif" font-size="9" font-weight="900" fill="#881337" text-anchor="middle">INSIDER VIP</text>
  </g>

  <!-- Top Badge -->
  <g transform="translate(35, 28)">
    <rect width="195" height="26" rx="13" fill="#831843"/>
    <circle cx="14" cy="13" r="4" fill="#fde047"/>
    <text x="26" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">BIG FASHION FESTIVAL</text>
    <text x="165" y="18" font-size="14">🇮🇳</text>
  </g>

  <!-- Headline -->
  <text x="35" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">
    END OF REASON SALE LIVE
  </text>
  <text x="35" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#fecdd3">
    50% - 80% Off Top Apparel, Footwear, Watches &amp; Beauty
  </text>

  <!-- Value Pill Tag -->
  <g transform="translate(35, 148)">
    <rect width="260" height="42" rx="10" fill="url(#myntra-gold)"/>
    <text x="130" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="900" fill="#4c0519" text-anchor="middle" letter-spacing="0.5">
      FLAT ₹400 OFF ON ORDERS
    </text>
  </g>

  <text x="35" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#fbcfe8">
    ★ Extra Flat ₹400 on First App Order &#8226; Free Shipping across India
  </text>
</svg>

