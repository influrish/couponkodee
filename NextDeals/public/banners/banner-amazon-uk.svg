<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="100%" height="100%">
  <defs>
    <linearGradient id="amz-uk-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="40%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="amz-uk-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="glow-circle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="250" rx="16" fill="url(#amz-uk-bg)"/>
  <circle cx="520" cy="50" r="140" fill="url(#glow-circle)"/>
  <circle cx="80" cy="220" r="90" fill="url(#glow-circle)"/>

  <!-- Top Badge: Official Event -->
  <g transform="translate(35, 28)">
    <rect width="175" height="26" rx="13" fill="#334155" stroke="#475569" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#10b981"/>
    <text x="26" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#f8fafc" letter-spacing="0.5">OFFICIAL UK EVENT</text>
    <text x="145" y="18" font-size="14">🇬🇧</text>
  </g>

  <!-- Right Pill: Prime Savings -->
  <g transform="translate(420, 28)">
    <rect width="145" height="26" rx="6" fill="#0284c7"/>
    <text x="72" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">PRIME ELIGIBLE</text>
  </g>

  <!-- Main Campaign Headline -->
  <text x="35" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">
    TODAY&apos;S SPRING DEALS
  </text>
  <text x="35" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#94a3b8">
    Massive Price Drops on Tech, Beauty, Pantry &amp; Smart Devices
  </text>

  <!-- Value Pill Tag -->
  <g transform="translate(35, 148)">
    <rect width="250" height="42" rx="10" fill="url(#amz-uk-gold)"/>
    <text x="125" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="0.5">
      FLAT 25% OFF ON ORDERS
    </text>
  </g>

  <!-- Amazon Smile Curve Graphic -->
  <g transform="translate(430, 110)">
    <!-- Shopping bag / box illustration -->
    <rect x="25" y="15" width="80" height="75" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2.5"/>
    <path d="M45 15 V5 Q65 -5 85 5 V15" stroke="#f59e0b" stroke-width="2.5" fill="none"/>
    <text x="65" y="58" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#f59e0b" text-anchor="middle">%</text>
    <!-- Amazon signature arrow -->
    <path d="M20 102 Q65 125 110 102" stroke="#f59e0b" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <path d="M102 96 L112 102 L105 112" stroke="#f59e0b" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Bottom Tagline -->
  <text x="35" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">
    ⚡ Fast UK Next-Day Delivery &#8226; 100% Verified Single-Click Voucher
  </text>
</svg>

