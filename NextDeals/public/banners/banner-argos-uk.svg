<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="100%" height="100%">
  <defs>
    <linearGradient id="argos-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="50%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="argos-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <rect width="600" height="250" rx="16" fill="url(#argos-bg)"/>
  
  <circle cx="500" cy="110" r="110" fill="#f97316" opacity="0.2"/>

  <!-- Right Graphic: Argos Box / Home -->
  <g transform="translate(435, 45)">
    <rect x="15" y="20" width="95" height="95" rx="14" fill="#18181b" stroke="#f97316" stroke-width="2.5"/>
    <text x="62" y="65" font-family="system-ui, sans-serif" font-size="24" font-weight="900" fill="#f97316" text-anchor="middle">Argos</text>
    <rect x="25" y="80" width="75" height="22" rx="4" fill="#dc2626"/>
    <text x="62" y="95" font-family="system-ui, sans-serif" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle">SAME DAY</text>
  </g>

  <!-- Top Badge -->
  <g transform="translate(35, 28)">
    <rect width="180" height="26" rx="13" fill="#450a0a"/>
    <circle cx="14" cy="13" r="4" fill="#f97316"/>
    <text x="26" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#f8fafc" letter-spacing="0.5">FAST TRACK DELIVERY</text>
    <text x="150" y="18" font-size="14">🇬🇧</text>
  </g>

  <!-- Headline -->
  <text x="35" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">
    MEGA SAVINGS ON HOME &amp; TOYS
  </text>
  <text x="35" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#fca5a5">
    Furniture, Outdoor Gear, Kitchen Appliances &amp; Top LEGO Deals
  </text>

  <!-- Value Pill Tag -->
  <g transform="translate(35, 148)">
    <rect width="250" height="42" rx="10" fill="url(#argos-orange)"/>
    <text x="125" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="0.5">
      FLAT 20% OFF AT CHECKOUT
    </text>
  </g>

  <text x="35" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#fdba74">
    ⚡ Fast Track 4-Hour Delivery to your door across the UK
  </text>
</svg>

