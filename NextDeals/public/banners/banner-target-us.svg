<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="100%" height="100%">
  <defs>
    <linearGradient id="target-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="50%" stop-color="#cc0000"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
  </defs>

  <rect width="600" height="250" rx="16" fill="url(#target-bg)"/>
  
  <circle cx="500" cy="110" r="110" fill="#FFFFFF" opacity="0.1"/>

  <!-- Right Graphic: Target Bullseye -->
  <g transform="translate(440, 50)">
    <circle cx="50" cy="50" r="45" fill="#cc0000" stroke="#FFFFFF" stroke-width="8"/>
    <circle cx="50" cy="50" r="22" fill="#FFFFFF"/>
    <circle cx="50" cy="50" r="12" fill="#cc0000"/>
    <rect x="5" y="105" width="90" height="22" rx="4" fill="#FFFFFF"/>
    <text x="50" y="120" font-family="system-ui, sans-serif" font-size="9" font-weight="900" fill="#cc0000" text-anchor="middle">TARGET CIRCLE</text>
  </g>

  <!-- Top Badge -->
  <g transform="translate(35, 28)">
    <rect width="180" height="26" rx="13" fill="#7f1d1d"/>
    <circle cx="14" cy="13" r="4" fill="#fca5a5"/>
    <text x="26" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">CIRCLE DEAL DAYS</text>
    <text x="150" y="18" font-size="14">🇺🇸</text>
  </g>

  <!-- Headline -->
  <text x="35" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">
    EXTRA 20% OFF AT CHECKOUT
  </text>
  <text x="35" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#fecaca">
    Save Big on Home, Kitchenware, Baby, Apparel &amp; Tech
  </text>

  <!-- Value Pill Tag -->
  <g transform="translate(35, 148)">
    <rect width="260" height="42" rx="10" fill="#FFFFFF"/>
    <text x="130" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="900" fill="#cc0000" text-anchor="middle" letter-spacing="0.5">
      EXTRA 20% ON ORDERS
    </text>
  </g>

  <text x="35" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#fca5a5">
    ★ Free Drive Up in 2 Hours &#8226; Same-Day Delivery with Target Circle 360
  </text>
</svg>

