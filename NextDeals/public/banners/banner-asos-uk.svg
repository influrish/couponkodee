<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="100%" height="100%">
  <defs>
    <linearGradient id="asos-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="60%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="asos-pink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>

  <rect width="600" height="250" rx="16" fill="url(#asos-bg)"/>
  
  <!-- Decorative grid lines & accent glow -->
  <circle cx="500" cy="120" r="130" fill="#ec4899" opacity="0.15"/>
  <rect x="420" y="25" width="130" height="195" rx="14" fill="#27272a" stroke="#3f3f46" stroke-width="1.5"/>
  <text x="485" y="115" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ec4899" text-anchor="middle">ASOS</text>
  <text x="485" y="145" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#a1a1aa" text-anchor="middle" letter-spacing="2">NEW SEASON</text>

  <!-- Top Badge -->
  <g transform="translate(35, 28)">
    <rect width="190" height="26" rx="13" fill="#3f3f46"/>
    <circle cx="14" cy="13" r="4" fill="#ec4899"/>
    <text x="26" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">FRESH STYLES &#8226; UK</text>
    <text x="160" y="18" font-size="14">🇬🇧</text>
  </g>

  <!-- Headline -->
  <text x="35" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">
    BIG SEASONAL DROP
  </text>
  <text x="35" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#a1a1aa">
    Trending Streetwear, Dresses, Trainers &amp; Designer Labels
  </text>

  <!-- Tag Pill -->
  <g transform="translate(35, 148)">
    <rect width="255" height="42" rx="10" fill="url(#asos-pink)"/>
    <text x="127" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">
      UP TO 30% OFF ON ORDERS
    </text>
  </g>

  <text x="35" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#f472b6">
    ★ Premier Delivery &#8226; Extra Student Discount &#8226; Verified UK Code
  </text>
</svg>

