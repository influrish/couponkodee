<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>
    <linearGradient id="overlayGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.65" />
      <stop offset="70%" stop-color="#000000" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="goldPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="500" fill="url(#bgGrad)" />

  <!-- Geometric Decorative Accents -->
  <g opacity="0.12">
    <circle cx="1050" cy="150" r="280" fill="#FFFFFF" />
    <circle cx="1150" cy="380" r="190" fill="#FFFFFF" />
    <path d="M 800 -50 L 1250 400 L 950 550 Z" fill="#FFFFFF" />
  </g>

  <!-- Dark readable overlay on left -->
  <rect width="1200" height="500" fill="url(#overlayGrad)" />

  <!-- Top Badges -->
  <g transform="translate(60, 55)">
    <!-- Official Partner Pill -->
    <rect width="210" height="38" rx="19" fill="#CC0000" />
    <text x="18" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">● Official Partner</text>

    <!-- Country Flag Pill -->
    <rect x="225" width="135" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.18" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" />
    <text x="245" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">🇨🇦 CA</text>
  </g>

  <!-- Brand Name & Kicker -->
  <text x="60" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#A5B4FC" letter-spacing="3" text-transform="uppercase">
    AMAZON CANADA &bull; PRIME DEALS IN CAD
  </text>

  <!-- Main Promo Headline -->
  <text x="60" y="215" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" filter="url(#shadow)" letter-spacing="-0.5">
    Flat 25% Off + Verified DealsD5E1">
      ✓ 100% Verified Today  &bull;  ⚡ Instant Single-Click Activation  &bull;  🛡️ Official Merchant Link
    </text>
  </g>

  <!-- Right Visual Brand Crest Display -->
  <g transform="translate(860, 110)">
    <rect width="280" height="280" rx="40" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2" filter="url(#shadow)" />
    <rect x="20" y="20" width="240" height="240" rx="30" fill="#FFFFFF" />
    <text x="140" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#1E293B" text-anchor="middle">
      Amazon Canada
    </text>
    <text x="140" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#64748B" text-anchor="middle" letter-spacing="2">
      OFFICIAL STORE
    </text>
    <rect x="50" y="185" width="180" height="34" rx="17" fill="#CC0000" />
    <text x="140" y="207" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle">
      UP TO 60% OFF
    </text>
  </g>
</svg>