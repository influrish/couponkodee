<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 230" width="100%" height="100%">
  <defs>
    <linearGradient id="ticketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="35%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="ticketShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="3" dy="10" stdDeviation="8" flood-color="#064e3b" flood-opacity="0.32" />
    </filter>
    <linearGradient id="gold1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#facc15" />
      <stop offset="70%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="goldDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
    <filter id="coinShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Confetti Elements -->
  <polygon points="35,40 40,52 46,44 41,32" fill="#f59e0b" opacity="0.85" transform="rotate(18 40 42)" />
  <polygon points="305,45 310,58 317,52 312,38" fill="#f59e0b" opacity="0.8" transform="rotate(-22 311 48)" />
  <circle cx="55" cy="22" r="2.5" fill="#10b981" opacity="0.75" />
  <circle cx="295" cy="28" r="3" fill="#10b981" opacity="0.7" />
  <polygon points="22,125 26,136 31,130 27,118" fill="#fbbf24" opacity="0.75" />
  <circle cx="320" cy="115" r="2.5" fill="#f59e0b" opacity="0.75" />

  <!-- Tilted Ticket Group -->
  <g transform="rotate(-8 160 105)" filter="url(#ticketShadow)">
    <!-- Ticket Body with Semi-Circle Cutouts -->
    <path d="M 38 22 H 262 A 18 18 0 0 1 280 40 V 78 A 20 20 0 0 0 280 118 V 156 A 18 18 0 0 1 262 174 H 38 A 18 18 0 0 1 20 156 V 118 A 20 20 0 0 0 20 78 V 40 A 18 18 0 0 1 38 22 Z"
          fill="url(#ticketGrad)" />
    
    <!-- Inner Dashed Stitching Border -->
    <path d="M 42 28 H 258 A 12 12 0 0 1 270 40 V 72 A 25 25 0 0 0 270 124 V 156 A 12 12 0 0 1 258 168 H 42 A 12 12 0 0 1 30 156 V 124 A 25 25 0 0 0 30 72 V 40 A 12 12 0 0 1 42 28 Z"
          fill="none" stroke="#6ee7b7" stroke-width="1.6" stroke-dasharray="4.5,4" opacity="0.65" />

    <!-- REAL CASH Pill Badge -->
    <rect x="90" y="35" width="120" height="25" rx="12.5" fill="#ffffff" opacity="0.95" />
    <text x="150" y="52" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="12" fill="#047857" letter-spacing="0.5">✦ REAL CASH ✦</text>

    <!-- Large Rate Text in Center -->
    <text x="150" y="114" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="46" fill="#ffffff" letter-spacing="-1">₹50</text>

    <!-- Bottom CASHBACK Label with Decorative Speed Dashes -->
    <path d="M 72 136 L 90 132 M 75 142 L 93 138" stroke="#a7f3d0" stroke-width="2.2" stroke-linecap="round" />
    <text x="150" y="143" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="15" fill="#ffffff" letter-spacing="2.5">CASHBACK</text>
    <path d="M 228 132 L 210 136 M 225 138 L 207 142" stroke="#a7f3d0" stroke-width="2.2" stroke-linecap="round" />
  </g>

  <!-- 3D Gold Coins Group (Bottom Right) -->
  <g transform="translate(230, 125)" filter="url(#coinShadow)">
    <!-- Coin 1 (Bottom stacked horizontal coin) -->
    <path d="M 10 40 C 10 31 32 25 58 25 C 84 25 106 31 106 40 V 49 C 106 58 84 64 58 64 C 32 64 10 58 10 49 Z" fill="url(#goldDark)" />
    <ellipse cx="58" cy="40" rx="48" ry="15" fill="url(#gold1)" />
    <ellipse cx="58" cy="40" rx="44" ry="12" fill="none" stroke="#fef08a" stroke-width="1.8" opacity="0.85" />

    <!-- Coin 2 (Front upright standing 3D coin) -->
    <g transform="translate(32, -6) rotate(14 36 36)">
      <!-- Rim / thickness -->
      <circle cx="38" cy="40" r="35" fill="url(#goldDark)" />
      <!-- Front Face -->
      <circle cx="36" cy="37" r="35" fill="url(#gold1)" />
      <circle cx="36" cy="37" r="31" fill="none" stroke="#fef08a" stroke-width="2.6" opacity="0.9" />
      <circle cx="36" cy="37" r="29" fill="url(#goldDark)" opacity="0.12" />
      <!-- Embossed Rupee Symbol -->
      <text x="36" y="49" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="36" fill="#92400e">₹</text>
      <!-- Specular Highlight Arc -->
      <path d="M 14 26 A 30 30 0 0 1 48 10" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.75" />
    </g>
  </g>
</svg>